<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>취뽀퀵 데모 V4</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen">
    <div id="root" class="w-full flex justify-center items-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ===================== 시연 데이터 =====================
        // 모든 기업명은 가상의 회사입니다.
        const SEED_SHORTS = [
            { id: 's1', company: "동네마켓", role: "콘텐츠 마케터", description: "동네 이웃을 연결하는 서비스를 함께 키울 콘텐츠 마케터를 찾습니다. 퀘스트로 실력을 보여주세요!", tags: ["자율출퇴근", "성장지원"], bgImage: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80" },
            { id: 's2', company: "스타일랩", role: "패션 MD", description: "트렌드를 읽고 상품을 기획하는 MD팀의 아이디어 회의 현장을 소개합니다 👕", tags: ["패션지원금", "트렌디"], bgImage: "https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=800&q=80" },
            { id: 's3', company: "핀플로우", role: "서비스 기획", description: "금융을 쉽게 만드는 팀. 데이터로 문제를 푸는 기획자를 기다립니다.", tags: ["원격근무", "스톡옵션"], bgImage: "https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=800&q=80" }
        ];

        const SEED_QUESTS = [
            { id: 'q1', company: "스타일랩", title: "가상 브랜드 겨울 프로모션 기획안 (1장)", bounty: 500000, deadline: "D-5", difficulty: "Easy", tags: ["MD", "프로모션"], description: "가상의 캐주얼 브랜드 ‘노스윈드’의 겨울 시즌 프로모션 핵심 카피와 메인 이벤트를 1장 기획안으로 제출해 주세요.", courseId: 'c2' },
            { id: 'q2', company: "딜리버리랩", title: "가상 장보기 앱 장바구니 이탈 개선안", bounty: 500000, deadline: "D-7", difficulty: "Medium", tags: ["UX/UI", "서비스기획"], description: "가상의 장보기 앱에서 장바구니 단계 이탈률이 40%입니다. 원인 가설과 화면 개선안을 제출해 주세요.", courseId: 'c3' },
            { id: 'q3', company: "핀플로우", title: "가상 금융 앱 신규 탭 트래픽 증대 전략", bounty: 1000000, deadline: "D-10", difficulty: "Hard", tags: ["사업기획", "데이터분석"], description: "가상의 금융 앱이 ‘소비 리포트’ 탭을 출시했습니다. 첫 3개월 방문자를 늘릴 전략과 측정 지표를 제안해 주세요.", courseId: 'c3' },
            { id: 'q4', company: "동네마켓", title: "가상 지역 커뮤니티 숏폼 콘텐츠 3편 기획", bounty: 300000, deadline: "D-3", difficulty: "Easy", tags: ["콘텐츠마케팅"], description: "가상의 지역 커뮤니티 앱을 알릴 숏폼 콘텐츠 3편의 콘셉트와 대본 개요를 제출해 주세요.", courseId: 'c1' }
        ];

        const COURSES = [
            { id: 'c1', title: "콘텐츠 마케팅 실무 4주", instructor: "현직 콘텐츠 마케터", price: 300000, weeks: 4, color: "bg-orange-500", desc: "숏폼 기획, 카피라이팅, 성과 측정까지 실제 과제로 배우는 과정" },
            { id: 'c2', title: "MD 상품기획 실무 4주", instructor: "이준호 원장 · 현직 MD", price: 300000, weeks: 4, color: "bg-pink-500", desc: "유통 MD 실무 교육 노하우로 배우는 상품 기획과 프로모션" },
            { id: 'c3', title: "서비스 기획·데이터 실무 4주", instructor: "현직 PM", price: 300000, weeks: 4, color: "bg-indigo-500", desc: "문제 정의, 지표 설계, 화면 기획을 퀘스트 실습으로 익히는 과정" },
            { id: 'c4', title: "취업 전략 특강 (무료)", instructor: "이준호 원장", price: 0, weeks: 1, color: "bg-gray-800", desc: "20년 취업뽀개기 노하우로 보는 수시채용 시대의 지원 전략" }
        ];

        // 기업 대시보드에 함께 보이는 시연용 가상 지원자 (나이·성별·학력 미수집)
        const MOCK_CANDIDATES = [
            { id: 'm1', name: "지원자 A", jobRole: "서비스 기획", quests: [{ title: "가상 금융 앱 신규 탭 트래픽 증대 전략", score: 91 }], courses: ["서비스 기획·데이터 실무 4주"] },
            { id: 'm2', name: "지원자 B", jobRole: "콘텐츠 마케터", quests: [{ title: "가상 지역 커뮤니티 숏폼 콘텐츠 3편 기획", score: 86 }, { title: "가상 브랜드 겨울 프로모션 기획안 (1장)", score: 78 }], courses: [] },
            { id: 'm3', name: "지원자 C", jobRole: "UX/UI 디자인", quests: [{ title: "가상 장보기 앱 장바구니 이탈 개선안", score: 88 }], courses: ["서비스 기획·데이터 실무 4주"] }
        ];

        const DEFAULT_BG = "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=800&q=80";

        // ===================== 유틸 =====================
        const loadState = (key, fallback) => {
            try {
                const saved = localStorage.getItem('cq4_' + key);
                return saved ? JSON.parse(saved) : fallback;
            } catch (e) {
                return fallback;
            }
        };
        const saveState = (key, value) => {
            try { localStorage.setItem('cq4_' + key, JSON.stringify(value)); } catch (e) {}
        };
        const usePersisted = (key, fallback) => {
            const [value, setValue] = useState(() => loadState(key, fallback));
            useEffect(() => { saveState(key, value); }, [key, value]);
            return [value, setValue];
        };
        const today = () => new Date().toLocaleDateString('ko-KR');
        const won = (n) => n === 0 ? '무료' : `₩${n.toLocaleString()}`;
        const extractVideoId = (url) => {
            if (!url) return '';
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/);
            return (match && match[2].length === 11) ? match[2] : '';
        };
        const copyLink = async (showToast, text) => {
            try {
                await navigator.clipboard.writeText(text || window.location.href);
                showToast('링크가 복사되었습니다.');
            } catch (e) {
                showToast('링크 복사에 실패했습니다.');
            }
        };
        const DEMO_FEEDBACK = [
            "문제 정의가 명확하고 근거 지표가 구체적입니다. 실행 우선순위를 조금 더 나눠 보면 좋겠습니다.",
            "아이디어가 참신합니다. 타깃 고객 설정을 숫자로 뒷받침하면 설득력이 더 커집니다.",
            "구성이 깔끔하고 핵심이 잘 드러납니다. 예상 리스크와 대안을 한 줄 추가해 보세요."
        ];

        // ===================== 앱 =====================
        function App() {
            const [role, setRole] = usePersisted('role', 'none');
            const [tab, setTab] = useState('feed');
            const [showAuth, setShowAuth] = useState(false);
            const [toast, setToast] = useState(null);
            const toastTimer = useRef(null);

            const [profile, setProfile] = usePersisted('profile', { name: '김뽀개', jobRole: '서비스 기획' });
            const [shorts, setShorts] = usePersisted('shorts', SEED_SHORTS);
            const [quests, setQuests] = usePersisted('quests', SEED_QUESTS);
            const [saved, setSaved] = usePersisted('saved', []);
            const [submissions, setSubmissions] = usePersisted('submissions', []);
            const [enrollments, setEnrollments] = usePersisted('enrollments', []);
            const [applications, setApplications] = usePersisted('applications', []);
            const [notifications, setNotifications] = usePersisted('notifications', []);
            const [questFilter, setQuestFilter] = useState(null);

            const showToast = (message) => {
                setToast(message);
                clearTimeout(toastTimer.current);
                toastTimer.current = setTimeout(() => setToast(null), 2800);
            };
            const requireAuth = (action) => role === 'none' ? setShowAuth(true) : action();
            const notify = (text, type = 'system') =>
                setNotifications(prev => [{ id: Date.now() + Math.random(), type, text, time: today(), read: false }, ...prev]);

            const store = {
                role, setRole, profile, setProfile, shorts, setShorts, quests, setQuests, saved, setSaved,
                submissions, setSubmissions, enrollments, setEnrollments, applications, setApplications,
                notifications, setNotifications, showToast, requireAuth, notify, setTab, questFilter, setQuestFilter
            };

            const resetDemo = () => {
                try { Object.keys(localStorage).filter(k => k.startsWith('cq4_')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
                window.location.reload();
            };

            if (role === 'employer') return <EmployerPortal store={store} resetDemo={resetDemo} />;

            const NAV = [
                { key: 'feed', icon: 'fa-play', label: '피드' },
                { key: 'quests', icon: 'fa-puzzle-piece', label: '퀘스트' },
                { key: 'academy', icon: 'fa-graduation-cap', label: '아카데미' },
                { key: 'record', icon: 'fa-award', label: '내 기록', auth: true },
                { key: 'my', icon: 'fa-user', label: '마이', auth: true }
            ];
            const unread = notifications.filter(n => !n.read).length;

            return (
                <div className="w-full sm:max-w-[400px] h-[100dvh] sm:h-[820px] bg-black relative overflow-hidden shadow-2xl sm:rounded-[40px] sm:border-[10px] border-black flex flex-col">
                    <div className="flex-1 overflow-hidden relative bg-white text-black">
                        {tab === 'feed' && <ShortsFeed store={store} />}
                        {tab === 'quests' && <QuestsView store={store} />}
                        {tab === 'academy' && <AcademyView store={store} />}
                        {tab === 'record' && <RecordView store={store} />}
                        {tab === 'my' && <MyPage store={store} resetDemo={resetDemo} />}
                    </div>

                    <nav className="h-[72px] bg-white border-t border-gray-200 flex justify-around items-center px-1 pb-2 z-40">
                        {NAV.map(n => (
                            <button key={n.key} onClick={() => n.auth ? requireAuth(() => setTab(n.key)) : setTab(n.key)}
                                className={`relative flex flex-col items-center justify-center w-16 h-full space-y-1 ${tab === n.key ? 'text-black' : 'text-gray-400'}`}>
                                <i className={`fa-solid ${n.icon} text-xl`}></i>
                                <span className="text-[10px] font-bold">{n.label}</span>
                                {n.key === 'my' && unread > 0 && <span className="absolute top-3 right-4 w-2 h-2 bg-[#E53935] rounded-full"></span>}
                            </button>
                        ))}
                    </nav>

                    {toast && (
                        <div className="absolute top-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-full shadow-lg z-[200] flex items-center gap-2 slide-up max-w-[90%]">
                            <i className="fa-solid fa-circle-check text-green-400"></i>
                            <span className="text-sm font-medium">{toast}</span>
                        </div>
                    )}
                    {showAuth && <AuthModal store={store} close={() => setShowAuth(false)} />}
                </div>
            );
        }

        // ===================== 로그인 =====================
        function AuthModal({ store, close }) {
            const { setRole, setProfile, profile, showToast } = store;
            const [mode, setMode] = useState('login'); // login | signup | employer
            const [agree, setAgree] = useState({ terms: false, privacy: false, marketing: false });
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [bizNumber, setBizNumber] = useState('');
            const [companyName, setCompanyName] = useState('');

            const finish = (nextRole, message) => {
                setRole(nextRole);
                close();
                showToast(message);
            };
            const checkSignupAgreement = () => {
                if (mode === 'signup' && (!agree.terms || !agree.privacy)) {
                    showToast('필수 약관에 동의해주세요.');
                    return false;
                }
                return true;
            };
            const social = (provider) => {
                if (!checkSignupAgreement()) return;
                finish('seeker', `[시연 모드] ${provider} 로그인이 완료되었습니다.`);
            };
            const emailSubmit = (e) => {
                e.preventDefault();
                if (!checkSignupAgreement()) return;
                if (password.length < 8) return showToast('비밀번호는 8자 이상이어야 합니다.');
                finish('seeker', mode === 'signup' ? '가입을 환영합니다! 첫 퀘스트에 도전해 보세요.' : '로그인되었습니다.');
            };
            const employerSubmit = (e) => {
                e.preventDefault();
                if (!/^\d{3}-?\d{2}-?\d{5}$/.test(bizNumber.trim())) return showToast('사업자등록번호 10자리를 정확히 입력해주세요.');
                if (password.length < 8) return showToast('비밀번호는 8자 이상이어야 합니다.');
                setProfile({ ...profile, companyName: companyName.trim() || '우리회사' });
                finish('employer', '[시연 모드] 기업 회원으로 로그인되었습니다.');
            };
            const allChecked = agree.terms && agree.privacy && agree.marketing;
            const input = "w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-black";

            return (
                <div className="absolute inset-0 bg-black/60 z-[100] flex items-end fade-in">
                    <div className="bg-white w-full max-h-[90%] rounded-t-[28px] p-6 slide-up flex flex-col">
                        <div className="flex justify-between items-center mb-5">
                            <div className="flex gap-4">
                                {[['login', '로그인'], ['signup', '회원가입'], ['employer', '기업']].map(([k, label]) => (
                                    <button key={k} onClick={() => setMode(k)} className={`font-black text-lg pb-1 ${mode === k ? 'text-black border-b-2 border-black' : 'text-gray-300'}`}>{label}</button>
                                ))}
                            </div>
                            <button onClick={close} className="w-8 h-8 bg-gray-100 rounded-full text-gray-500"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        <div className="overflow-y-auto no-scrollbar space-y-4 pb-4">
                            {mode === 'employer' ? (
                                <form onSubmit={employerSubmit} className="space-y-3">
                                    <p className="text-sm text-gray-500">사업자 인증을 거친 기업만 퀘스트와 공고를 등록할 수 있습니다.</p>
                                    <input className={input} placeholder="회사명" value={companyName} onChange={e => setCompanyName(e.target.value)} required />
                                    <input className={input} inputMode="numeric" placeholder="사업자등록번호 (000-00-00000)" value={bizNumber} onChange={e => setBizNumber(e.target.value)} required />
                                    <input className={input} type="email" placeholder="담당자 이메일" value={email} onChange={e => setEmail(e.target.value)} required />
                                    <input className={input} type="password" placeholder="비밀번호 (8자리 이상)" value={password} onChange={e => setPassword(e.target.value)} required />
                                    <button className="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold text-sm">기업 회원 로그인</button>
                                </form>
                            ) : (
                                <>
                                    {mode === 'signup' && (
                                        <div className="bg-gray-50 p-4 rounded-2xl border border-gray-200 space-y-2 text-sm">
                                            <label className="flex items-center gap-2 font-bold border-b border-gray-200 pb-2">
                                                <input type="checkbox" className="w-4 h-4 accent-black" checked={allChecked} onChange={() => setAgree({ terms: !allChecked, privacy: !allChecked, marketing: !allChecked })} /> 전체 동의
                                            </label>
                                            <label className="flex items-center gap-2"><input type="checkbox" className="w-4 h-4 accent-black" checked={agree.terms} onChange={() => setAgree({ ...agree, terms: !agree.terms })} /> [필수] 이용약관 동의</label>
                                            <label className="flex items-center gap-2"><input type="checkbox" className="w-4 h-4 accent-black" checked={agree.privacy} onChange={() => setAgree({ ...agree, privacy: !agree.privacy })} /> [필수] 개인정보 수집·이용 동의</label>
                                            <label className="flex items-center gap-2"><input type="checkbox" className="w-4 h-4 accent-black" checked={agree.marketing} onChange={() => setAgree({ ...agree, marketing: !agree.marketing })} /> [선택] 마케팅 정보 수신 동의</label>
                                            <p className="text-[11px] text-gray-400 pt-1">취뽀퀵은 블라인드 원칙에 따라 나이·성별·학력을 수집하지 않습니다.</p>
                                        </div>
                                    )}
                                    <button onClick={() => social('카카오')} className="w-full py-3.5 bg-[#FEE500] text-black rounded-xl font-bold text-sm"><i className="fa-solid fa-comment mr-2"></i>카카오로 시작하기</button>
                                    <button onClick={() => social('네이버')} className="w-full py-3.5 bg-[#03C75A] text-white rounded-xl font-bold text-sm">네이버로 시작하기</button>
                                    <button onClick={() => social('구글')} className="w-full py-3.5 bg-white border border-gray-300 rounded-xl font-bold text-sm"><i className="fa-brands fa-google mr-2"></i>구글로 시작하기</button>
                                    <form onSubmit={emailSubmit} className="space-y-3 pt-2 border-t border-gray-100">
                                        <input className={input} type="email" placeholder="이메일" value={email} onChange={e => setEmail(e.target.value)} required />
                                        <input className={input} type="password" placeholder="비밀번호 (8자리 이상)" value={password} onChange={e => setPassword(e.target.value)} required />
                                        <button className="w-full py-3.5 bg-black text-white rounded-xl font-bold text-sm">{mode === 'signup' ? '이메일로 가입하기' : '이메일로 로그인'}</button>
                                    </form>
                                    <p className="text-[11px] text-gray-400 text-center">시연 버전: 소셜 로그인은 실제 연동 전입니다.</p>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ===================== 피드 (채용 브랜딩 쇼츠) =====================
        function ShortsFeed({ store }) {
            const { shorts, showToast, requireAuth, setTab, setQuestFilter, quests } = store;
            const goQuests = (company) => {
                const hasQuest = quests.some(q => q.company === company);
                setQuestFilter(hasQuest ? company : null);
                setTab('quests');
                if (!hasQuest) showToast(`${company}의 진행 중인 퀘스트가 없어 전체 목록을 보여드립니다.`);
            };
            return (
                <div className="h-full w-full overflow-y-scroll snap-y snap-mandatory no-scrollbar bg-black relative">
                    <div className="absolute top-6 left-6 z-30 pointer-events-none">
                        <span className="text-2xl font-black text-[#E53935] italic">취뽀</span><span className="text-2xl font-black text-white italic">퀵</span>
                    </div>
                    {shorts.map(s => {
                        const videoId = s.videoId;
                        const bg = videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : (s.bgImage || DEFAULT_BG);
                        return (
                            <div key={s.id} className="h-full w-full snap-start relative flex items-end pb-8">
                                <div className="absolute inset-0 bg-cover bg-center opacity-80" style={{ backgroundImage: `url(${bg})` }} />
                                <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent" />
                                <button onClick={() => copyLink(showToast)} className="absolute right-5 top-20 text-white text-2xl z-10"><i className="fa-solid fa-share"></i></button>
                                <div className="relative z-10 w-full px-6 text-center text-white">
                                    <div className="w-14 h-14 bg-white text-black rounded-full flex justify-center items-center font-black text-xl mx-auto mb-3">{s.company.charAt(0)}</div>
                                    <h2 className="text-xl font-bold">{s.company}</h2>
                                    <h3 className="text-[#FF8A65] text-sm font-bold mb-3">{s.role}</h3>
                                    <p className="text-white/90 text-xs leading-relaxed mb-4 px-2 line-clamp-3">{s.description}</p>
                                    <div className="flex justify-center flex-wrap gap-2 mb-5">
                                        {s.tags.map(t => <span key={t} className="text-[10px] font-bold bg-white/20 px-3 py-1 rounded-full border border-white/30">#{t.replace(/^#/, '')}</span>)}
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => goQuests(s.company)} className="flex-1 py-3.5 bg-white text-black rounded-full font-bold text-sm"><i className="fa-solid fa-puzzle-piece mr-1"></i> 이 기업 퀘스트</button>
                                        <button onClick={() => requireAuth(() => store.setTab('record'))} className="flex-1 py-3.5 bg-[#E53935] text-white rounded-full font-bold text-sm"><i className="fa-solid fa-award mr-1"></i> 역량 기록으로 지원</button>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }

        // ===================== 퀘스트 =====================
        function QuestsView({ store }) {
            const { quests, saved, setSaved, submissions, setSubmissions, enrollments, requireAuth, showToast, questFilter, setQuestFilter, notify } = store;
            const [onlySaved, setOnlySaved] = useState(false);
            const [selected, setSelected] = useState(null);
            const [link, setLink] = useState('');
            const [memo, setMemo] = useState('');

            const completedCourses = enrollments.filter(e => e.progress >= 100).map(e => e.courseId);
            const list = quests
                .filter(q => !questFilter || q.company === questFilter)
                .filter(q => !onlySaved || saved.includes(q.id));
            const submittedIds = submissions.map(s => s.questId);

            const toggleSave = (id) => requireAuth(() => {
                setSaved(saved.includes(id) ? saved.filter(x => x !== id) : [...saved, id]);
                showToast(saved.includes(id) ? '저장을 해제했습니다.' : '퀘스트를 저장했습니다.');
            });
            const submit = (e) => {
                e.preventDefault();
                if (!/^https?:\/\//.test(link.trim())) return showToast('결과물 링크(https://...)를 입력해주세요.');
                setSubmissions(prev => [{ id: Date.now(), questId: selected.id, title: selected.title, company: selected.company, link: link.trim(), memo, date: today(), status: 'reviewing' }, ...prev]);
                notify(`${selected.company} 퀘스트를 제출했습니다. 기업 평가 후 내 기록에 반영됩니다.`, 'quest');
                showToast('제출 완료! [내 기록]에서 진행 상황을 확인하세요.');
                setSelected(null); setLink(''); setMemo('');
            };

            return (
                <div className="h-full flex flex-col pt-8 relative">
                    <div className="px-6 pb-3">
                        <h1 className="text-3xl font-black tracking-tight"><span className="text-[#E53935]">바운티</span> 퀘스트</h1>
                        <p className="text-gray-500 text-xs mt-1">가상 실무 과제를 풀고 상금과 피드백, 채용 기회를 얻으세요</p>
                        <div className="flex gap-2 mt-4 overflow-x-auto no-scrollbar">
                            <button onClick={() => { setOnlySaved(false); setQuestFilter(null); }} className={`px-4 py-1.5 rounded-full text-xs font-bold border ${!onlySaved && !questFilter ? 'bg-black text-white border-black' : 'border-gray-300 text-gray-600'}`}>전체</button>
                            <button onClick={() => requireAuth(() => setOnlySaved(true))} className={`px-4 py-1.5 rounded-full text-xs font-bold border ${onlySaved ? 'bg-black text-white border-black' : 'border-gray-300 text-gray-600'}`}><i className="fa-solid fa-bookmark mr-1"></i>저장한 퀘스트</button>
                            {questFilter && <span className="px-4 py-1.5 rounded-full text-xs font-bold bg-red-50 text-[#E53935] border border-red-200 whitespace-nowrap">{questFilter} <button onClick={() => setQuestFilter(null)}><i className="fa-solid fa-xmark ml-1"></i></button></span>}
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto px-6 space-y-4 pb-6 no-scrollbar">
                        {list.length === 0 && <p className="text-center text-gray-400 text-sm py-16">해당하는 퀘스트가 없습니다.</p>}
                        {list.map(q => {
                            const priority = q.courseId && completedCourses.includes(q.courseId);
                            const done = submittedIds.includes(q.id);
                            return (
                                <div key={q.id} className="bg-[#2C2C2E] rounded-[22px] p-5 text-white">
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="flex gap-1.5 flex-wrap">
                                            <span className="bg-gray-200 text-gray-800 text-[10px] font-bold px-2 py-1 rounded-md">{q.deadline}</span>
                                            <span className="bg-green-500/20 text-green-300 text-[10px] font-bold px-2 py-1 rounded-md"><i className="fa-solid fa-lock mr-1"></i>상금 예치 완료</span>
                                            {priority && <span className="bg-yellow-400/20 text-yellow-300 text-[10px] font-bold px-2 py-1 rounded-md">수료생 우선</span>}
                                        </div>
                                        <button onClick={() => toggleSave(q.id)} className="text-lg"><i className={`${saved.includes(q.id) ? 'fa-solid text-[#E53935]' : 'fa-regular text-gray-400'} fa-bookmark`}></i></button>
                                    </div>
                                    <p className="text-gray-400 text-xs font-semibold">{q.company}</p>
                                    <h3 className="font-bold text-base leading-snug mb-3">{q.title}</h3>
                                    <div className="flex gap-1.5 mb-4 flex-wrap">{q.tags.map(t => <span key={t} className="text-[10px] text-gray-300 bg-gray-700/60 px-2 py-1 rounded-md">{t}</span>)}</div>
                                    <div className="flex justify-between items-center border-t border-gray-700 pt-3">
                                        <button onClick={() => requireAuth(() => setSelected(q))} className={`text-sm font-bold px-4 py-2 rounded-xl ${done ? 'bg-gray-600 text-gray-300' : 'bg-white text-black'}`}>{done ? '제출 완료' : '상세보기 · 제출'}</button>
                                        <span className="font-black text-[#FF5252] text-lg">{won(q.bounty)}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {selected && (
                        <div className="absolute inset-0 bg-black/60 z-[90] flex items-end fade-in">
                            <div className="bg-white w-full h-[90%] rounded-t-3xl flex flex-col slide-up">
                                <div className="p-4 flex justify-end"><button onClick={() => setSelected(null)} className="text-gray-400 text-2xl"><i className="fa-solid fa-xmark"></i></button></div>
                                <div className="px-6 overflow-y-auto flex-1 no-scrollbar pb-6">
                                    <p className="text-gray-500 text-sm font-semibold">{selected.company}</p>
                                    <h1 className="text-xl font-black leading-tight mb-4">{selected.title}</h1>
                                    <div className="bg-gray-100 rounded-2xl p-4 flex justify-between mb-4">
                                        <div><p className="text-[11px] text-gray-500 font-bold">우승 상금 (1명)</p><p className="text-xl font-black text-[#E53935]">{won(selected.bounty)}</p></div>
                                        <div className="text-right"><p className="text-[11px] text-gray-500 font-bold">난이도 / 마감</p><p className="font-bold">{selected.difficulty} / {selected.deadline}</p></div>
                                    </div>
                                    <h3 className="font-bold mb-2">미션</h3>
                                    <p className="text-gray-600 text-sm leading-relaxed bg-gray-50 p-4 rounded-xl border border-gray-100 mb-4">{selected.description}</p>
                                    <div className="bg-blue-50 border border-blue-100 rounded-xl p-4 text-xs text-blue-900 space-y-1 mb-5">
                                        <p className="font-bold mb-1"><i className="fa-solid fa-shield-halved mr-1"></i> 취뽀퀵 퀘스트 원칙</p>
                                        <p>· 실제 업무가 아닌 가상 시나리오 과제입니다.</p>
                                        <p>· 미선정 결과물의 권리는 제출자에게 있습니다.</p>
                                        <p>· 상금은 출제 시 예치되었고, 제출자 전원에게 피드백이 제공됩니다.</p>
                                    </div>
                                    {submittedIds.includes(selected.id) ? (
                                        <p className="text-center text-sm font-bold text-gray-500 py-4">이미 제출한 퀘스트입니다. [내 기록]에서 확인하세요.</p>
                                    ) : (
                                        <form onSubmit={submit} className="space-y-3">
                                            <h3 className="font-bold">결과물 제출</h3>
                                            <input type="url" value={link} onChange={e => setLink(e.target.value)} placeholder="노션·피그마·구글드라이브 링크" className="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm outline-none focus:border-black" required />
                                            <textarea value={memo} onChange={e => setMemo(e.target.value)} placeholder="핵심 아이디어 한 줄 요약 (선택)" rows="2" className="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm outline-none focus:border-black resize-none" />
                                            <button className="w-full py-4 bg-black text-white rounded-2xl font-bold"><i className="fa-solid fa-paper-plane mr-2"></i>제출하기</button>
                                        </form>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ===================== 아카데미 =====================
        function AcademyView({ store }) {
            const { enrollments, setEnrollments, requireAuth, showToast, quests, notify } = store;
            const [selected, setSelected] = useState(null);
            const getEnroll = (id) => enrollments.find(e => e.courseId === id);

            const enroll = (course) => requireAuth(() => {
                if (getEnroll(course.id)) return;
                setEnrollments(prev => [...prev, { courseId: course.id, title: course.title, progress: 0, startDate: today() }]);
                showToast(course.price ? '[시연 모드] 결제 없이 수강 신청되었습니다.' : '무료 특강 수강 신청이 완료되었습니다.');
            });
            const study = (course) => {
                const step = Math.round(100 / Math.max(course.weeks, 1));
                setEnrollments(prev => prev.map(e => {
                    if (e.courseId !== course.id) return e;
                    const progress = Math.min(100, e.progress + step);
                    if (progress >= 100 && e.progress < 100) {
                        notify(`‘${course.title}’ 수료! 수료 기록이 내 기록에 추가되고 연계 퀘스트 우선 참여권이 생겼습니다.`, 'academy');
                        showToast('수료를 축하합니다! 🎓');
                        return { ...e, progress, doneDate: today() };
                    }
                    return { ...e, progress };
                }));
            };

            return (
                <div className="h-full flex flex-col pt-8">
                    <div className="px-6 pb-4">
                        <h1 className="text-3xl font-black tracking-tight">취뽀 <span className="text-[#E53935]">아카데미</span></h1>
                        <p className="text-gray-500 text-xs mt-1">배우고 → 퀘스트로 증명하고 → 채용까지. 이준호 원장과 현직자가 함께합니다.</p>
                    </div>
                    <div className="flex-1 overflow-y-auto px-6 space-y-4 pb-6 no-scrollbar">
                        <div className="bg-gray-900 text-white rounded-2xl p-4 flex items-center gap-3">
                            <div className="w-10 h-10 bg-[#E53935] rounded-full flex items-center justify-center shrink-0"><i className="fa-solid fa-route"></i></div>
                            <p className="text-xs leading-relaxed">수료하면 <b>수료 기록</b>이 역량 기록에 반영되고, 연계 퀘스트에 <b>우선 참여</b>할 수 있습니다.</p>
                        </div>
                        {COURSES.map(c => {
                            const e = getEnroll(c.id);
                            const linked = quests.filter(q => q.courseId === c.id);
                            return (
                                <div key={c.id} className="border border-gray-200 rounded-2xl overflow-hidden">
                                    <div className={`${c.color} h-2`}></div>
                                    <div className="p-4">
                                        <div className="flex justify-between items-start">
                                            <h3 className="font-bold text-base">{c.title}</h3>
                                            <span className="font-black text-sm">{won(c.price)}</span>
                                        </div>
                                        <p className="text-xs text-gray-500 mt-1">{c.instructor} · {c.weeks}주</p>
                                        <p className="text-sm text-gray-600 mt-2">{c.desc}</p>
                                        {linked.length > 0 && <p className="text-[11px] text-indigo-600 font-semibold mt-2"><i className="fa-solid fa-link mr-1"></i>연계 퀘스트 {linked.length}개</p>}
                                        {e ? (
                                            <div className="mt-3">
                                                <div className="flex justify-between text-[11px] font-bold text-gray-500 mb-1"><span>{e.progress >= 100 ? `수료 (${e.doneDate})` : '진도율'}</span><span>{e.progress}%</span></div>
                                                <div className="h-2 bg-gray-200 rounded-full overflow-hidden"><div className="h-full bg-black rounded-full transition-all" style={{ width: `${e.progress}%` }}></div></div>
                                                {e.progress < 100 && <button onClick={() => study(c)} className="w-full mt-3 py-2.5 bg-black text-white rounded-xl text-sm font-bold">다음 강의 듣기 (시연)</button>}
                                            </div>
                                        ) : (
                                            <button onClick={() => enroll(c)} className="w-full mt-3 py-2.5 bg-gray-100 rounded-xl text-sm font-bold hover:bg-gray-200">수강 신청</button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // ===================== 내 기록 (실무 역량 기록) =====================
        function RecordView({ store }) {
            const { profile, submissions, setSubmissions, enrollments, applications, setApplications, shorts, showToast, notify } = store;
            const [applyOpen, setApplyOpen] = useState(false);
            const scored = submissions.filter(s => s.status === 'scored');
            const avg = scored.length ? Math.round(scored.reduce((a, s) => a + s.score, 0) / scored.length) : null;
            const courses = enrollments.filter(e => e.progress >= 100);

            const demoEvaluate = (sub) => {
                const score = 75 + (String(sub.id).length * 7 + sub.title.length) % 20;
                const feedback = DEMO_FEEDBACK[sub.title.length % DEMO_FEEDBACK.length];
                setSubmissions(prev => prev.map(s => s.id === sub.id ? { ...s, status: 'scored', score, feedback } : s));
                notify(`${sub.company}에서 퀘스트 평가와 피드백을 보냈습니다. (${score}점)`, 'quest');
                showToast('[시연 모드] 기업 평가가 도착했습니다.');
            };
            const applyTo = (s) => {
                if (applications.some(a => a.company === s.company && a.role === s.role)) return showToast('이미 지원한 포지션입니다.');
                setApplications(prev => [{ id: Date.now(), company: s.company, role: s.role, date: today(), status: 'applied' }, ...prev]);
                showToast(`${s.company}에 역량 기록으로 지원했습니다.`);
                setApplyOpen(false);
            };
            const STATUS = { applied: ['검토 중', 'bg-blue-50 text-blue-600'], interview: ['면접 제안', 'bg-green-50 text-green-600'] };

            return (
                <div className="h-full overflow-y-auto no-scrollbar pt-8 pb-6 bg-gray-50">
                    <div className="px-6">
                        <h1 className="text-3xl font-black tracking-tight mb-4">실무 역량 기록</h1>
                        <div className="bg-gradient-to-br from-gray-900 to-gray-700 text-white rounded-3xl p-5 shadow-lg">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-xs text-gray-300">Proof Record</p>
                                    <h2 className="text-xl font-black">{profile.name}</h2>
                                    <p className="text-sm text-gray-300">{profile.jobRole}</p>
                                </div>
                                <button onClick={() => copyLink(showToast, window.location.href + '#record')} className="text-xs bg-white/15 px-3 py-1.5 rounded-full"><i className="fa-solid fa-link mr-1"></i>기업에 공유</button>
                            </div>
                            <div className="grid grid-cols-3 gap-2 mt-5 text-center">
                                <div className="bg-white/10 rounded-xl py-2"><p className="text-lg font-black">{submissions.length}</p><p className="text-[10px] text-gray-300">퀘스트 제출</p></div>
                                <div className="bg-white/10 rounded-xl py-2"><p className="text-lg font-black">{avg ?? '-'}</p><p className="text-[10px] text-gray-300">평균 점수</p></div>
                                <div className="bg-white/10 rounded-xl py-2"><p className="text-lg font-black">{courses.length}</p><p className="text-[10px] text-gray-300">수료 과정</p></div>
                            </div>
                            <p className="text-[10px] text-gray-400 mt-3">나이·성별·학력 정보는 포함되지 않습니다.</p>
                        </div>
                        <button onClick={() => setApplyOpen(true)} className="w-full mt-4 py-3.5 bg-[#E53935] text-white rounded-2xl font-bold shadow"><i className="fa-solid fa-bolt mr-2"></i>역량 기록으로 지원하기</button>

                        <h3 className="font-bold mt-6 mb-2">퀘스트 결과</h3>
                        {submissions.length === 0 && <p className="text-sm text-gray-400 bg-white rounded-2xl p-4 border border-gray-100">아직 제출한 퀘스트가 없습니다. 퀘스트 탭에서 도전해 보세요!</p>}
                        <div className="space-y-3">
                            {submissions.map(s => (
                                <div key={s.id} className="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
                                    <div className="flex justify-between items-center mb-1">
                                        <span className="text-xs text-gray-500">{s.company} · {s.date}</span>
                                        {s.status === 'scored'
                                            ? <span className="text-sm font-black text-[#E53935]">{s.score}점</span>
                                            : <span className="text-[10px] font-bold bg-yellow-50 text-yellow-700 px-2 py-1 rounded-md">기업 평가 대기</span>}
                                    </div>
                                    <p className="font-bold text-sm">{s.title}</p>
                                    {s.feedback && <p className="text-xs text-gray-600 bg-gray-50 rounded-lg p-2.5 mt-2"><i className="fa-solid fa-comment-dots mr-1 text-gray-400"></i>{s.feedback}</p>}
                                    {s.status !== 'scored' && <button onClick={() => demoEvaluate(s)} className="text-[11px] text-gray-400 underline mt-2">시연: 기업 평가 받기</button>}
                                </div>
                            ))}
                        </div>

                        <h3 className="font-bold mt-6 mb-2">아카데미 수료</h3>
                        {courses.length === 0 ? <p className="text-sm text-gray-400 bg-white rounded-2xl p-4 border border-gray-100">수료한 과정이 없습니다.</p> : (
                            <div className="space-y-2">{courses.map(c => <div key={c.courseId} className="bg-white rounded-2xl p-4 border border-gray-100 flex justify-between text-sm"><span className="font-bold"><i className="fa-solid fa-graduation-cap mr-2 text-indigo-500"></i>{c.title}</span><span className="text-gray-400 text-xs">{c.doneDate}</span></div>)}</div>
                        )}

                        <h3 className="font-bold mt-6 mb-2">지원 현황</h3>
                        {applications.length === 0 ? <p className="text-sm text-gray-400 bg-white rounded-2xl p-4 border border-gray-100">지원 내역이 없습니다.</p> : (
                            <div className="space-y-2">{applications.map(a => (
                                <div key={a.id} className="bg-white rounded-2xl p-4 border border-gray-100 flex justify-between items-center">
                                    <div><p className="font-bold text-sm">{a.company}</p><p className="text-xs text-gray-500">{a.role} · {a.date}</p></div>
                                    <span className={`text-[11px] font-bold px-2 py-1 rounded-md ${STATUS[a.status][1]}`}>{STATUS[a.status][0]}</span>
                                </div>
                            ))}</div>
                        )}
                    </div>

                    {applyOpen && (
                        <div className="absolute inset-0 bg-black/60 z-[90] flex items-end fade-in">
                            <div className="bg-white w-full rounded-t-3xl p-6 slide-up max-h-[80%] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4"><h3 className="font-black text-lg">어디에 지원할까요?</h3><button onClick={() => setApplyOpen(false)} className="text-gray-400 text-xl"><i className="fa-solid fa-xmark"></i></button></div>
                                <p className="text-xs text-gray-500 mb-3">자기소개서 대신 지금까지의 퀘스트 결과와 수료 기록이 전달됩니다.</p>
                                <div className="space-y-2">{shorts.map(s => (
                                    <button key={s.id} onClick={() => applyTo(s)} className="w-full text-left border border-gray-200 rounded-xl p-3 hover:border-black">
                                        <p className="font-bold text-sm">{s.company}</p><p className="text-xs text-gray-500">{s.role}</p>
                                    </button>
                                ))}</div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ===================== 마이페이지 =====================
        function MyPage({ store, resetDemo }) {
            const { profile, setProfile, notifications, setNotifications, setRole, setTab, showToast } = store;
            const [edit, setEdit] = useState(false);
            const [draft, setDraft] = useState(profile);
            const ICON = { quest: 'fa-puzzle-piece', academy: 'fa-graduation-cap', interview: 'fa-handshake', system: 'fa-bell' };

            return (
                <div className="h-full overflow-y-auto no-scrollbar pt-8 pb-6 px-6">
                    <h1 className="text-2xl font-black mb-5">마이페이지</h1>
                    <div className="flex items-center gap-4 mb-6">
                        <div className="w-16 h-16 rounded-full bg-gray-900 text-white flex items-center justify-center text-2xl font-black">{profile.name.charAt(0)}</div>
                        <div className="flex-1">
                            {edit ? (
                                <div className="space-y-2">
                                    <input value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} className="w-full border-b border-gray-300 py-1 font-bold outline-none" />
                                    <input value={draft.jobRole} onChange={e => setDraft({ ...draft, jobRole: e.target.value })} className="w-full border-b border-gray-300 py-1 text-sm outline-none" placeholder="희망 직무" />
                                </div>
                            ) : (<><p className="font-bold text-lg">{profile.name}</p><p className="text-sm text-gray-500">{profile.jobRole}</p></>)}
                        </div>
                        <button onClick={() => { if (edit) { setProfile({ ...profile, ...draft }); showToast('프로필이 저장되었습니다.'); } setEdit(!edit); }} className="text-xs font-bold border border-gray-300 px-3 py-1.5 rounded-lg">{edit ? '저장' : '수정'}</button>
                    </div>

                    <div className="flex justify-between items-center mb-2">
                        <h3 className="font-bold">알림</h3>
                        {notifications.some(n => !n.read) && <button onClick={() => setNotifications(notifications.map(n => ({ ...n, read: true })))} className="text-xs text-gray-400">모두 읽음</button>}
                    </div>
                    {notifications.length === 0 && <p className="text-sm text-gray-400 py-4">새 알림이 없습니다.</p>}
                    <div className="space-y-2 mb-6">
                        {notifications.slice(0, 8).map(n => (
                            <div key={n.id} className={`p-3 rounded-2xl flex gap-3 ${n.read ? 'bg-white border border-gray-100' : 'bg-red-50 border border-red-100'}`}>
                                <div className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 ${n.read ? 'bg-gray-100 text-gray-500' : 'bg-[#E53935] text-white'}`}><i className={`fa-solid ${ICON[n.type] || 'fa-bell'} text-sm`}></i></div>
                                <div><p className="text-sm">{n.text}</p><p className="text-[10px] text-gray-400 mt-1">{n.time}</p></div>
                            </div>
                        ))}
                    </div>

                    <div className="space-y-2">
                        <button onClick={() => setTab('record')} className="w-full py-3 bg-gray-100 rounded-xl text-sm font-bold">내 실무 역량 기록 보기</button>
                        <button onClick={() => { setRole('none'); setTab('feed'); showToast('로그아웃되었습니다.'); }} className="w-full py-3 border border-gray-200 rounded-xl text-sm font-bold text-gray-500">로그아웃</button>
                        <button onClick={resetDemo} className="w-full py-2 text-xs text-gray-400 underline">시연 데이터 초기화</button>
                    </div>
                </div>
            );
        }

        // ===================== 기업 포털 =====================
        function EmployerPortal({ store, resetDemo }) {
            const { profile, setRole } = store;
            const [section, setSection] = useState('dashboard');
            const MENU = [
                ['dashboard', 'fa-users', '지원자 대시보드'],
                ['quest', 'fa-puzzle-piece', '퀘스트 출제'],
                ['shorts', 'fa-video', '채용 쇼츠 등록']
            ];
            return (
                <div className="w-full min-h-screen bg-gray-50 flex flex-col md:flex-row">
                    <aside className="md:w-60 bg-white border-b md:border-b-0 md:border-r border-gray-200 p-5 flex md:flex-col gap-2 md:gap-1 overflow-x-auto">
                        <div className="hidden md:block mb-6">
                            <p className="text-xl font-black"><span className="text-[#E53935]">취뽀</span>퀵 <span className="text-sm text-gray-400">기업</span></p>
                            <p className="text-sm text-gray-500 mt-1">{profile.companyName || '우리회사'}</p>
                        </div>
                        {MENU.map(([k, icon, label]) => (
                            <button key={k} onClick={() => setSection(k)} className={`whitespace-nowrap text-left px-4 py-2.5 rounded-xl text-sm font-bold ${section === k ? 'bg-black text-white' : 'text-gray-600 hover:bg-gray-100'}`}><i className={`fa-solid ${icon} w-5`}></i>{label}</button>
                        ))}
                        <div className="md:mt-auto flex md:flex-col gap-1">
                            <button onClick={() => setRole('none')} className="whitespace-nowrap text-left px-4 py-2.5 rounded-xl text-sm text-gray-500 hover:bg-gray-100"><i className="fa-solid fa-arrow-right-from-bracket w-5"></i>로그아웃</button>
                            <button onClick={resetDemo} className="whitespace-nowrap text-left px-4 py-2 text-xs text-gray-400 underline">시연 데이터 초기화</button>
                        </div>
                    </aside>
                    <main className="flex-1 p-6 md:p-10 max-w-4xl">
                        {section === 'dashboard' && <EmployerDashboard store={store} />}
                        {section === 'quest' && <QuestCreator store={store} done={() => setSection('dashboard')} />}
                        {section === 'shorts' && <ShortsCreator store={store} />}
                    </main>
                </div>
            );
        }

        function EmployerDashboard({ store }) {
            const { profile, submissions, setSubmissions, enrollments, applications, setApplications, notify, showToast } = store;
            const [review, setReview] = useState(null);
            const [score, setScore] = useState(85);
            const [feedback, setFeedback] = useState('');
            const [offered, setOffered] = useState([]);

            const me = {
                id: 'me', name: profile.name, jobRole: profile.jobRole, isReal: true,
                quests: submissions.map(s => ({ title: s.title, score: s.score, sub: s })),
                courses: enrollments.filter(e => e.progress >= 100).map(e => e.title)
            };
            const candidates = [...(submissions.length || applications.length ? [me] : []), ...MOCK_CANDIDATES];

            const sendReview = (e) => {
                e.preventDefault();
                setSubmissions(prev => prev.map(s => s.id === review.id ? { ...s, status: 'scored', score: Number(score), feedback: feedback || DEMO_FEEDBACK[0] } : s));
                notify(`${review.company} 퀘스트 평가가 도착했습니다. (${score}점)`, 'quest');
                showToast('평가와 피드백을 전송했습니다.');
                setReview(null); setFeedback('');
            };
            const offer = (c) => {
                setOffered(prev => [...prev, c.id]);
                if (c.isReal) {
                    const company = profile.companyName || '우리회사';
                    setApplications(prev => {
                        const exists = prev.find(a => a.company === company);
                        return exists ? prev.map(a => a.company === company ? { ...a, status: 'interview' } : a)
                                      : [{ id: Date.now(), company, role: c.jobRole, date: today(), status: 'interview' }, ...prev];
                    });
                    notify(`${company}에서 면접을 제안했습니다! 🎉`, 'interview');
                }
                showToast(`${c.name}님에게 면접을 제안했습니다.`);
            };

            return (
                <div>
                    <h1 className="text-3xl font-black mb-1">지원자 대시보드</h1>
                    <p className="text-gray-500 mb-6 text-sm">서류 대신 퀘스트 결과물과 수료 기록으로 후보를 확인하세요. 나이·성별·학력은 표시되지 않습니다.</p>
                    <div className="grid md:grid-cols-2 gap-4">
                        {candidates.map(c => {
                            const scores = c.quests.filter(q => q.score).map(q => q.score);
                            const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
                            return (
                                <div key={c.id} className="bg-white rounded-2xl p-5 border border-gray-200 shadow-sm">
                                    <div className="flex justify-between items-start mb-3">
                                        <div>
                                            <p className="font-black text-lg">{c.name} {c.isReal && <span className="text-[10px] bg-red-50 text-[#E53935] px-2 py-0.5 rounded-md align-middle">시연 중인 사용자</span>}</p>
                                            <p className="text-sm text-gray-500">{c.jobRole}</p>
                                        </div>
                                        <div className="text-right"><p className="text-2xl font-black text-[#E53935]">{avg ?? '-'}</p><p className="text-[10px] text-gray-400">평균 점수</p></div>
                                    </div>
                                    <div className="space-y-1.5 mb-3">
                                        {c.quests.length === 0 && <p className="text-xs text-gray-400">제출한 퀘스트 없음</p>}
                                        {c.quests.map((q, i) => (
                                            <div key={i} className="flex justify-between items-center text-xs bg-gray-50 rounded-lg px-3 py-2">
                                                <span className="truncate mr-2">{q.title}</span>
                                                {q.score ? <b>{q.score}점</b> : <button onClick={() => setReview(q.sub)} className="shrink-0 font-bold text-indigo-600">평가하기</button>}
                                            </div>
                                        ))}
                                    </div>
                                    {c.courses.length > 0 && <p className="text-xs text-indigo-600 mb-3"><i className="fa-solid fa-graduation-cap mr-1"></i>{c.courses.join(', ')} 수료</p>}
                                    <button onClick={() => offer(c)} disabled={offered.includes(c.id)} className={`w-full py-2.5 rounded-xl text-sm font-bold ${offered.includes(c.id) ? 'bg-gray-100 text-gray-400' : 'bg-black text-white'}`}>{offered.includes(c.id) ? '면접 제안 완료' : '면접 제안하기'}</button>
                                </div>
                            );
                        })}
                    </div>

                    {review && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                            <form onSubmit={sendReview} className="bg-white rounded-3xl p-6 w-full max-w-md space-y-4">
                                <h3 className="font-black text-lg">퀘스트 평가</h3>
                                <p className="text-sm text-gray-600">{review.title}</p>
                                <a href={review.link} target="_blank" rel="noreferrer" className="text-xs text-indigo-600 underline break-all">{review.link}</a>
                                <label className="block text-sm font-bold">점수: {score}점
                                    <input type="range" min="50" max="100" value={score} onChange={e => setScore(e.target.value)} className="w-full accent-black" />
                                </label>
                                <textarea value={feedback} onChange={e => setFeedback(e.target.value)} rows="3" placeholder="제출자에게 전달될 피드백 (모든 제출자에게 피드백이 제공됩니다)" className="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm outline-none resize-none" />
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setReview(null)} className="flex-1 py-3 bg-gray-100 rounded-xl font-bold text-sm">취소</button>
                                    <button className="flex-1 py-3 bg-black text-white rounded-xl font-bold text-sm">평가 전송</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        function QuestCreator({ store, done }) {
            const { profile, setQuests, showToast } = store;
            const [form, setForm] = useState({ title: '', description: '', bounty: 500000, days: 7, tags: '', courseId: '' });
            const [checks, setChecks] = useState({ virtual: false, rights: false, escrow: false });
            const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
            const input = "w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-black";

            const submit = (e) => {
                e.preventDefault();
                if (!checks.virtual || !checks.rights || !checks.escrow) return showToast('퀘스트 운영 원칙 3가지에 모두 동의해주세요.');
                const bounty = Number(form.bounty);
                setQuests(prev => [{
                    id: 'q' + Date.now(), company: profile.companyName || '우리회사', title: form.title, description: form.description,
                    bounty, deadline: `D-${form.days}`, difficulty: bounty >= 1000000 ? 'Hard' : 'Medium',
                    tags: form.tags.split(',').map(t => t.trim()).filter(Boolean), courseId: form.courseId || null
                }, ...prev]);
                showToast(`[시연 모드] 상금 ${won(bounty)} 예치 후 퀘스트가 게시되었습니다. (수수료 15%: ${won(Math.round(bounty * 0.15))})`);
                done();
            };

            return (
                <form onSubmit={submit} className="space-y-5">
                    <div><h1 className="text-3xl font-black mb-1">퀘스트 출제</h1><p className="text-gray-500 text-sm">가상 시나리오 과제로 지원자의 실무 역량을 확인하세요.</p></div>
                    <div className="bg-white p-6 rounded-2xl border border-gray-200 space-y-4">
                        <input className={input} placeholder="퀘스트 제목 (예: 가상 브랜드 SNS 캠페인 기획)" value={form.title} onChange={set('title')} required />
                        <textarea className={input + " resize-none"} rows="4" placeholder="미션 설명 — 실제 사내 업무가 아닌 가상의 상황으로 작성해주세요." value={form.description} onChange={set('description')} required />
                        <div className="grid grid-cols-2 gap-3">
                            <label className="text-xs font-bold text-gray-500">상금 (원)<input type="number" min="100000" step="50000" className={input + " mt-1"} value={form.bounty} onChange={set('bounty')} required /></label>
                            <label className="text-xs font-bold text-gray-500">마감 (일)<input type="number" min="1" max="30" className={input + " mt-1"} value={form.days} onChange={set('days')} required /></label>
                        </div>
                        <input className={input} placeholder="태그 (쉼표로 구분)" value={form.tags} onChange={set('tags')} />
                        <label className="text-xs font-bold text-gray-500 block">연계 아카데미 과정 (선택)
                            <select className={input + " mt-1"} value={form.courseId} onChange={set('courseId')}>
                                <option value="">연계 없음</option>
                                {COURSES.filter(c => c.price > 0).map(c => <option key={c.id} value={c.id}>{c.title}</option>)}
                            </select>
                        </label>
                    </div>
                    <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100 space-y-2 text-sm text-blue-900">
                        <p className="font-bold"><i className="fa-solid fa-shield-halved mr-1"></i>퀘스트 운영 원칙 (필수)</p>
                        <label className="flex gap-2"><input type="checkbox" className="accent-black mt-1" checked={checks.virtual} onChange={() => setChecks({ ...checks, virtual: !checks.virtual })} />실제 사내 업무가 아닌 가상 시나리오 과제입니다.</label>
                        <label className="flex gap-2"><input type="checkbox" className="accent-black mt-1" checked={checks.rights} onChange={() => setChecks({ ...checks, rights: !checks.rights })} />미선정 결과물의 권리는 제출자에게 귀속되며, 제출자 전원에게 피드백을 제공합니다.</label>
                        <label className="flex gap-2"><input type="checkbox" className="accent-black mt-1" checked={checks.escrow} onChange={() => setChecks({ ...checks, escrow: !checks.escrow })} />상금을 게시 전에 예치합니다. (플랫폼 수수료 15%)</label>
                    </div>
                    <button className="w-full py-4 bg-black text-white rounded-2xl font-bold">상금 예치하고 퀘스트 게시하기</button>
                </form>
            );
        }

        function ShortsCreator({ store }) {
            const { profile, setShorts, showToast } = store;
            const [qna, setQna] = useState({ culture: '', skill: '', task: '', perk: '' });
            const [form, setForm] = useState({ role: '', youtubeUrl: '', description: '', tags: '' });
            const videoId = extractVideoId(form.youtubeUrl);
            const company = profile.companyName || '우리회사';
            const input = "w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-black";

            const draft = () => {
                if (!qna.culture || !qna.skill) return showToast('조직 문화와 중요 역량은 꼭 입력해주세요.');
                setForm({
                    ...form,
                    description: `${qna.culture} 분위기에서 ${qna.skill}을(를) 갖춘 동료를 찾습니다.${qna.task ? ` 첫 업무: ${qna.task}` : ''}`.slice(0, 150),
                    tags: [qna.culture, qna.perk].filter(Boolean).join(', ')
                });
                showToast('[시연 모드] 답변을 바탕으로 문구 초안을 만들었습니다.');
            };
            const publish = (e) => {
                e.preventDefault();
                setShorts(prev => [{
                    id: 's' + Date.now(), company, role: form.role, description: form.description, videoId,
                    tags: form.tags.split(',').map(t => t.trim()).filter(Boolean)
                }, ...prev]);
                showToast('채용 쇼츠가 구직자 피드 맨 위에 게시되었습니다.');
                setForm({ role: '', youtubeUrl: '', description: '', tags: '' });
            };

            return (
                <div className="grid lg:grid-cols-[1fr_300px] gap-8">
                    <div className="space-y-5">
                        <div><h1 className="text-3xl font-black mb-1">채용 쇼츠 등록</h1><p className="text-gray-500 text-sm">질문에 답하면 AI가 쇼츠 문구 초안을 만들어 드립니다. (기업 구독 포함 기능)</p></div>
                        <div className="bg-white p-6 rounded-2xl border border-gray-200 space-y-3">
                            <p className="font-bold text-sm"><i className="fa-solid fa-wand-magic-sparkles mr-1 text-[#E53935]"></i>AI 문구 초안</p>
                            <input className={input} placeholder="우리 조직 문화를 한마디로? (예: 수평적이고 빠른)" value={qna.culture} onChange={e => setQna({ ...qna, culture: e.target.value })} />
                            <input className={input} placeholder="가장 중요하게 보는 역량은? (예: 데이터 기반 문제 해결)" value={qna.skill} onChange={e => setQna({ ...qna, skill: e.target.value })} />
                            <input className={input} placeholder="신규 입사자의 첫 업무는? (선택)" value={qna.task} onChange={e => setQna({ ...qna, task: e.target.value })} />
                            <input className={input} placeholder="자랑할 만한 복지는? (선택)" value={qna.perk} onChange={e => setQna({ ...qna, perk: e.target.value })} />
                            <button type="button" onClick={draft} className="w-full py-3 bg-gray-900 text-white rounded-xl font-bold text-sm">문구 초안 만들기</button>
                        </div>
                        <form onSubmit={publish} className="bg-white p-6 rounded-2xl border border-gray-200 space-y-3">
                            <input className={input} placeholder="채용 직무" value={form.role} onChange={e => setForm({ ...form, role: e.target.value })} required />
                            <input className={input} type="url" placeholder="유튜브 쇼츠 링크 (선택)" value={form.youtubeUrl} onChange={e => setForm({ ...form, youtubeUrl: e.target.value })} />
                            <textarea className={input + " resize-none"} rows="3" maxLength="150" placeholder="핵심 어필 포인트 (150자 이내)" value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} required />
                            <input className={input} placeholder="태그 (쉼표로 구분)" value={form.tags} onChange={e => setForm({ ...form, tags: e.target.value })} />
                            <button className="w-full py-3.5 bg-black text-white rounded-xl font-bold">피드에 게시하기</button>
                        </form>
                    </div>
                    <div className="hidden lg:block">
                        <p className="text-sm font-bold text-gray-500 mb-3"><i className="fa-solid fa-mobile-screen mr-1"></i>구직자 화면 미리보기</p>
                        <div className="w-[280px] h-[560px] rounded-[32px] border-[8px] border-black overflow-hidden relative bg-gray-900 text-white">
                            <div className="absolute inset-0 bg-cover bg-center opacity-70" style={{ backgroundImage: `url(${videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : DEFAULT_BG})` }} />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/90 to-transparent" />
                            <div className="absolute bottom-0 p-5 text-center w-full">
                                <p className="font-bold">{company}</p>
                                <p className="text-[#FF8A65] text-xs font-bold mb-2">{form.role || '채용 직무'}</p>
                                <p className="text-xs text-white/90 mb-3 line-clamp-3">{form.description || '핵심 어필 포인트가 여기에 표시됩니다.'}</p>
                                <div className="flex justify-center flex-wrap gap-1">{form.tags.split(',').map(t => t.trim()).filter(Boolean).map(t => <span key={t} className="text-[9px] bg-white/20 px-2 py-0.5 rounded-full">#{t}</span>)}</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
